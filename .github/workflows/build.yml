name: Samsung Direct Power CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build & Package Module
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Module Package
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Upload Module Artifact
        uses: actions/upload-artifact@v7
        with:
          name: Samsung_Direct_Power
          path: |
            Samsung_Direct_Power.zip
            Samsung_Direct_Power.zip.sha256

      - name: Publish GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            Samsung_Direct_Power.zip
            Samsung_Direct_Power.zip.sha256
          name: Samsung Direct Power ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
